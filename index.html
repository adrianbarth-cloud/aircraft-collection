<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aircraft Collection</title>
<style>
:root{--bg:#0b0e13;--panel:#131821;--panel2:#1a202b;--text:#f4f7fb;--muted:#8f9aaa;--line:#28303c;--accent:#7dd3fc;--good:#86efac}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex}.sidebar{width:240px;border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;background:#0d1117}.brand{font-weight:800;font-size:18px;padding:8px 10px 25px;letter-spacing:.2px}.brand span{color:var(--accent)}nav button{width:100%;border:0;background:transparent;color:var(--muted);padding:12px 10px;text-align:left;border-radius:10px;margin:3px 0}nav button.active,nav button:hover{background:var(--panel2);color:var(--text)}.main{flex:1;max-width:1400px;margin:auto;padding:28px 34px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:25px}.title h1{margin:0;font-size:30px}.title p{margin:6px 0;color:var(--muted)}.primary{background:var(--text);color:#10141a;border:0;padding:11px 16px;border-radius:10px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px}.stat{padding:18px}.stat .num{font-size:30px;font-weight:800;margin-top:5px}.label{color:var(--muted);font-size:13px}.panel{padding:20px;margin-top:18px}.panel h2{margin:0 0 16px;font-size:18px}.barrow{margin:13px 0}.barhead{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}.bar{height:7px;background:#252c37;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:20px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:hidden}.card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#202630}.card .info{padding:13px}.card strong{display:block}.card small{color:var(--muted)}.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;margin-bottom:15px}input,select{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:11px 12px;border-radius:10px;outline:none}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modal.open{display:flex}.dialog{width:min(760px,100%);max-height:90vh;overflow:auto;background:#11161e;border:1px solid var(--line);border-radius:18px;padding:22px}.dialog h2{margin-top:0}.preview{width:100%;max-height:330px;object-fit:contain;background:#090b0f;border-radius:12px;margin:10px 0 18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.secondary{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 14px;border-radius:10px}.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:15px}.achievement{display:flex;gap:13px;align-items:center;padding:13px;border:1px solid var(--line);border-radius:12px;margin:9px 0;background:#11161e}.badge{font-size:26px}.locked{opacity:.42}.toast{position:fixed;bottom:22px;right:22px;background:#eef2f7;color:#10141a;padding:12px 16px;border-radius:10px;display:none;z-index:9;font-weight:700}
@media(max-width:900px){.sidebar{width:72px}.brand{font-size:0}.brand span{font-size:20px}nav button{font-size:0;text-align:center}nav button:before{content:"•";font-size:22px}.main{padding:22px 16px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.sidebar{display:none}.top{align-items:flex-start}.title h1{font-size:24px}.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.filters{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><div class="brand">✈ <span>Aircraft Collection</span></div>
<nav>
<button class="active" data-page="dashboard">Dashboard</button>
<button data-page="collection">Meine Sammlung</button>
<button data-page="add">＋ Hinzufügen</button>
<button data-page="stats">Statistiken</button>
<button data-page="achievements">🏆 Achievements</button>
</nav></aside>
<main class="main" id="main"></main>
</div>

<div class="modal" id="modal"><div class="dialog">
<h2>Flugzeug hinzufügen</h2>
<div id="uploadStep">
<input type="file" id="photo" accept="image/*">
<div id="formArea" style="display:none">
<img id="preview" class="preview">
<p class="label">KI-Vorschlag (Demo): Bitte überprüfe die automatisch vorgeschlagenen Angaben.</p>
<div class="formgrid">
<div class="field"><label>Airline</label><input id="airline" value="Lufthansa"></div>
<div class="field"><label>Hersteller</label><input id="manufacturer" value="Airbus"></div>
<div class="field"><label>Modell</label><input id="model" value="A350"></div>
<div class="field"><label>Variante</label><input id="variant" value="A350-900"></div>
<div class="field"><label>Flughafen</label><input id="airport" placeholder="z. B. Tokyo Haneda (HND)"></div>
<div class="field"><label>Land</label><input id="country" placeholder="z. B. Japan"></div>
</div>
<div class="actions"><button class="secondary" onclick="closeModal()">Abbrechen</button><button class="primary" onclick="publish()">Veröffentlichen</button></div>
</div></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const key="aircraft_collection_v1";
let entries=JSON.parse(localStorage.getItem(key)||"[]");
let page="dashboard";

const seed=[
{airline:"Lufthansa",manufacturer:"Airbus",model:"A350",variant:"A350-900",airport:"Tokyo Haneda (HND)",country:"Japan",photo:"https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=900&q=80",createdAt:"2026-08-27T10:00:00"},
{airline:"ANA",manufacturer:"Boeing",model:"777",variant:"777-300ER",airport:"Tokyo Haneda (HND)",country:"Japan",photo:"https://images.unsplash.com/photo-1540962351504-03099e0a754b?auto=format&fit=crop&w=900&q=80",createdAt:"2026-08-26T10:00:00"},
{airline:"Japan Airlines",manufacturer:"Airbus",model:"A350",variant:"A350-900",airport:"Tokyo Haneda (HND)",country:"Japan",photo:"https://images.unsplash.com/photo-1474302770737-173ee21bab63?auto=format&fit=crop&w=900&q=80",createdAt:"2026-08-25T10:00:00"}
];
if(!entries.length){entries=seed;save()}

function save(){localStorage.setItem(key,JSON.stringify(entries))}
function unique(field){return new Set(entries.map(e=>e[field]).filter(Boolean)).size}
function counts(field){return entries.reduce((a,e)=>(a[e[field]]=(a[e[field]]||0)+1,a),{})}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function card(e,i){return `<div class="card"><img src="${esc(e.photo)}" alt="Flugzeugfoto"><div class="info"><strong>${esc(e.airline)} · ${esc(e.model)}</strong><small>${esc(e.variant)} · ${esc(e.airport)}</small></div></div>`}
function topBars(field){let c=counts(field), arr=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,5), max=arr[0]?.[1]||1;return arr.map(([n,v])=>`<div class="barrow"><div class="barhead"><span>${esc(n)}</span><b>${v}</b></div><div class="bar"><i style="width:${v/max*100}%"></i></div></div>`).join("")||'<div class="label">Noch keine Daten.</div>'}

function dashboard(){let recent=[...entries].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).slice(0,8);return `
<div class="top"><div class="title"><h1>Dein Aviation Dashboard</h1><p>Deine persönliche Flugzeug-Sammlung auf einen Blick.</p></div><button class="primary" onclick="openModal()">＋ Flugzeug hinzufügen</button></div>
<div class="stats">
<div class="stat"><div class="label">Aircraft</div><div class="num">${entries.length}</div></div>
<div class="stat"><div class="label">Airlines</div><div class="num">${unique("airline")}</div></div>
<div class="stat"><div class="label">Aircraft Types</div><div class="num">${unique("variant")}</div></div>
<div class="stat"><div class="label">Länder</div><div class="num">${unique("country")}</div></div>
</div>
<div class="panel"><h2>Zuletzt fotografiert</h2><div class="grid">${recent.map(card).join("")}</div></div>
<div class="panel"><h2>Top Airlines</h2>${topBars("airline")}</div>`}

function collection(){return `<div class="top"><div class="title"><h1>Meine Sammlung</h1><p>${entries.length} fotografierte Flugzeuge</p></div><button class="primary" onclick="openModal()">＋ Hinzufügen</button></div>
<div class="filters"><input id="search" placeholder="Suche nach Airline, Modell, Variante, Flughafen …"><select id="mf"><option value="">Alle Hersteller</option>${[...new Set(entries.map(e=>e.manufacturer))].sort().map(x=>`<option>${esc(x)}</option>`).join("")}</select><select id="af"><option value="">Alle Airlines</option>${[...new Set(entries.map(e=>e.airline))].sort().map(x=>`<option>${esc(x)}</option>`).join("")}</select><select id="sort"><option value="new">Neueste zuerst</option><option value="old">Älteste zuerst</option></select></div>
<div class="grid" id="collectionGrid"></div>`}

function renderCollection(){let q=(document.getElementById("search")?.value||"").toLowerCase(),m=document.getElementById("mf")?.value||"",a=document.getElementById("af")?.value||"",s=document.getElementById("sort")?.value||"new";let list=entries.filter(e=>(`${e.airline} ${e.manufacturer} ${e.model} ${e.variant} ${e.airport} ${e.country}`.toLowerCase().includes(q))&&(!m||e.manufacturer===m)&&(!a||e.airline===a)).sort((x,y)=>s==="new"?new Date(y.createdAt)-new Date(x.createdAt):new Date(x.createdAt)-new Date(y.createdAt));document.getElementById("collectionGrid").innerHTML=list.length?list.map((e,i)=>card(e,i)).join(""):'<div class="empty" style="grid-column:1/-1">Keine passenden Flugzeuge gefunden.</div>'}

function stats(){return `<div class="top"><div class="title"><h1>Statistiken</h1><p>Was steckt in deiner Sammlung?</p></div></div><div class="stats"><div class="stat"><div class="label>Einträge</div><div class="num">${entries.length}</div></div><div class="stat"><div class="label">Hersteller</div><div class="num">${unique("manufacturer")}</div></div><div class="stat"><div class="label">Modelle</div><div class="num">${unique("model")}</div></div><div class="stat"><div class="label">Flughäfen</div><div class="num">${unique("airport")}</div></div></div><div class="panel"><h2>Hersteller</h2>${topBars("manufacturer")}</div><div class="panel"><h2>Modelle</h2>${topBars("model")}</div><div class="panel"><h2>Flughäfen</h2>${topBars("airport")}</div>`}

function achievements(){let n=entries.length, airlines=unique("airline"), models=unique("model"), variants=unique("variant");let ach=[["🛫","Erster Flug","Fotografiere dein erstes Flugzeug",n>=1],["✈️","Spotter","Sammle 10 Flugzeuge",n>=10],["🏆","Aircraft Collector","Sammle 100 Flugzeuge",n>=100],["🌍","Airline Collector","Fotografiere 10 verschiedene Airlines",airlines>=10],["🔭","Type Hunter","Sammle 10 verschiedene Flugzeugtypen",models>=10],["⭐","Variant Hunter","Sammle 25 verschiedene Varianten",variants>=25]];return `<div class="top"><div class="title"><h1>Achievements</h1><p>Dein persönlicher Aviation-Pokédex.</p></div></div><div class="panel">${ach.map(x=>`<div class="achievement ${x[3]?'':'locked'}"><div class="badge">${x[0]}</div><div><strong>${x[1]}</strong><div class="label">${x[2]}</div></div><div style="margin-left:auto">${x[3]?'✓':'🔒'}</div></div>`).join("")}</div>`}

function render(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));main.innerHTML=page==="dashboard"?dashboard():page==="collection"?collection():page==="stats"?stats():achievements();if(page==="collection"){["search","mf","af","sort"].forEach(id=>document.getElementById(id).addEventListener("input",renderCollection));renderCollection()}}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});
function openModal(){modal.classList.add("open");photo.value="";formArea.style.display="none"}
function closeModal(){modal.classList.remove("open")}
photo.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{preview.src=r.result;formArea.style.display="block"};r.readAsDataURL(f)}
function publish(){if(!photo.files[0])return;let e={airline:airline.value,manufacturer:manufacturer.value,model:model.value,variant:variant.value,airport:airport.value||"Unbekannt",country:country.value||"Unbekannt",photo:preview.src,createdAt:new Date().toISOString()};entries.unshift(e);save();closeModal();toast("✈️ Flugzeug veröffentlicht!");page="collection";render()}
function toast(t){let x=document.getElementById("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",2200)}
render();
</script>
</body></html>
