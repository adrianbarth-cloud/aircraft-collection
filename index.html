<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0e13"><title>Aircraft Collection V4</title>
<style>
:root{--bg:#0b0e13;--card:#131821;--line:#28303c;--text:#f4f7fb;--muted:#8f9aaa;--accent:#7dd3fc;--danger:#fb7185}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:760px;margin:auto;padding-bottom:90px}.top{padding:24px 18px 10px;display:flex;justify-content:space-between}.brand{font-weight:800;font-size:21px}.small,.muted{color:var(--muted)}.hero{padding:25px 18px 12px}.hero h1{font-size:38px;line-height:1.05;margin:0 0 8px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 18px 18px}.stat,.post,.ach{background:var(--card);border:1px solid var(--line);border-radius:16px}.stat{padding:15px}.stat b{display:block;font-size:28px}.add{margin:0 18px 18px;width:calc(100% - 36px);padding:14px;border:0;border-radius:14px;background:var(--text);font-weight:800}.post{margin:0 18px 18px;overflow:hidden}.photos{position:relative;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.photos::-webkit-scrollbar{display:none}.photos img,.placeholder{width:100%;aspect-ratio:1;object-fit:cover;flex:0 0 100%;scroll-snap-align:start;background:#253241}.dots{position:absolute;top:12px;right:12px;background:#000a;padding:5px 9px;border-radius:99px;font-size:12px}.postbody{padding:13px 16px 16px}.postbody b{font-size:18px}.sub{color:var(--muted);margin-top:4px}.tap{color:var(--accent);font-size:12px;margin-top:9px}.toolbar{padding:0 18px 12px}.search,.field input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text)}.filters{display:flex;gap:8px;overflow:auto;padding:0 18px 12px}.filters select,.secondary{background:var(--card);color:var(--text);border:1px solid var(--line);padding:9px;border-radius:10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.grid img{width:100%;aspect-ratio:1;object-fit:cover}.empty{margin:20px 18px;padding:35px 20px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}.form{padding:0 18px}.field{margin-bottom:14px}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}.drop{padding:20px;text-align:center;border:1px dashed var(--line);border-radius:13px;color:var(--muted)}.preview{display:flex;gap:8px;overflow:auto;margin:9px 0 16px}.thumb{position:relative;flex:0 0 105px}.thumb img{width:105px;height:105px;object-fit:cover;border-radius:10px}.thumb button{position:absolute;right:3px;top:3px;border:0;border-radius:50%;width:25px;height:25px;background:#000b;color:white}.primary{width:100%;padding:14px;border:0;border-radius:13px;background:var(--text);font-weight:800}.nav{position:fixed;z-index:20;bottom:0;left:0;right:0;background:#10151d;border-top:1px solid var(--line);display:flex;justify-content:center;gap:5px;padding:9px 5px calc(9px + env(safe-area-inset-bottom))}.nav button{background:none;border:0;color:var(--muted);padding:7px 12px;border-radius:12px;font-size:11px}.nav button.active{color:var(--text);background:#1b2430}.nav span{display:block;font-size:20px}.page{display:none}.page.active{display:block}.ach{margin:0 18px 12px;padding:16px}.ach.locked{opacity:.55}.bar{height:7px;background:#252c37;border-radius:99px;margin-top:10px}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}.modal{position:fixed;inset:0;background:#000d;z-index:30;display:none;overflow:auto}.modal.show{display:block}.modalbox{min-height:100%;background:var(--bg)}.modalhead{position:sticky;top:0;background:#0b0e13ee;backdrop-filter:blur(10px);padding:12px 18px;display:flex;justify-content:space-between;z-index:2}.detailphotos{display:flex;overflow-x:auto;scroll-snap-type:x mandatory}.detailphotos img{width:100%;aspect-ratio:1;object-fit:cover;flex:0 0 100%;scroll-snap-align:start}.detailbody{padding:20px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}.chip{border:1px solid var(--line);padding:8px 10px;border-radius:12px;color:var(--muted)}.actions{display:flex;gap:9px}.danger{color:var(--danger)}
.toast{position:fixed;z-index:50;left:18px;right:18px;bottom:88px;padding:14px 16px;border-radius:14px;background:#16231c;border:1px solid #2d5940;color:#d9ffe5;display:none;box-shadow:0 10px 30px #0007}.toast.show{display:block}.rankbox,.yearcard{margin:0 18px 14px;padding:18px;background:var(--card);border:1px solid var(--line);border-radius:16px}.bar{height:7px;background:#252c37;border-radius:99px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}.rarity{font-size:10px;border:1px solid var(--line);padding:3px 7px;border-radius:99px;color:var(--muted)}.yeargrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.yeargrid div{padding:12px;border:1px solid var(--line);border-radius:12px}.yeargrid b{display:block;font-size:24px}</style></head><body><div class="app">
<header class="top"><div class="brand">✈ Aircraft Collection</div><div id="countTop" class="small"></div></header>
<section id="dashboard" class="page active"><div class="hero"><h1>Deine Sammlung</h1><div class="muted">Deine neuesten Aircraft zuerst.</div></div><div class="stats"><div class="stat"><span class="muted">Aircraft</span><b id="aircraftCount">0</b></div><div class="stat"><span class="muted">Fotos</span><b id="photoCount">0</b></div></div><button class="add" onclick="showPage('add')">＋ Flugzeug hinzufügen</button><div id="milestoneBox"></div><div id="feed"></div></section>
<section id="collection" class="page"><div class="hero"><h1>Sammlung</h1><div class="muted" id="resultCount"></div></div><div class="toolbar"><input id="q" class="search" placeholder="Suche nach Airline, Hersteller, Modell, Registrierung …" oninput="renderCollection()"></div><div class="filters"><select id="mf" onchange="renderCollection()"><option value="">Hersteller</option></select><select id="af" onchange="renderCollection()"><option value="">Airline</option></select><select id="vf" onchange="renderCollection()"><option value="">Variante</option></select><select id="rf" onchange="renderCollection()"><option value="">Registrierung</option></select><button class="secondary" onclick="resetFilters()">↺</button></div><div style="padding:0 18px 12px"><button class="secondary" onclick="setView('posts')">☰ Posts</button> <button class="secondary" onclick="setView('grid')">▦ Raster</button></div><div id="collectionContent"></div></section>
<section id="add" class="page"><div class="hero"><h1 id="formTitle">Neues Flugzeug</h1><div class="muted">Alle Angaben sind optional.</div></div><form class="form" onsubmit="publish(event)"><div class="field"><label>Fotos</label><div class="drop"><input id="files" type="file" accept="image/*" multiple onchange="previewFiles(event)"></div><div id="preview" class="preview"></div></div><div class="field"><label>Hersteller</label><input id="manufacturer" placeholder="z. B. Airbus"></div><div class="field"><label>Modell</label><input id="model" placeholder="z. B. A350"></div><div class="field"><label>Variante</label><input id="variant" placeholder="z. B. A350-900"></div><div class="field"><label>Airline</label><input id="airline" placeholder="z. B. Lufthansa"></div><div class="field"><label>Registrierung</label><input id="registration" placeholder="z. B. D-AIXT"></div><div class="field"><label>Flughafen</label><input id="airport" placeholder="z. B. München (MUC)"></div><div style="display:flex;gap:9px"><button type="button" class="secondary" style="flex:1" onclick="resetForm();showPage('dashboard')">Abbrechen</button><button class="primary" style="flex:2">Veröffentlichen</button></div></form></section>

<section id="achievements" class="page"><div class="hero"><h1>Achievements 🏆</h1><div class="muted">Sammle Flugzeuge, Airlines und Modelle.</div></div><div id="achList"></div></section></div>
<nav class="nav"><button data-page="dashboard" class="active" onclick="showPage('dashboard')"><span>⌂</span>Dashboard</button><button data-page="collection" onclick="showPage('collection')"><span>▦</span>Sammlung</button><button data-page="add" onclick="resetForm();showPage('add')"><span>＋</span>Hinzufügen</button><button data-page="achievements" onclick="showPage('achievements')"><span>🏆</span>Achievements</button></nav>
<div id="modal" class="modal"><div class="modalbox"><div class="modalhead"><button class="secondary" onclick="closeModal()">← Zurück</button><span id="detailTitle"></span><button class="secondary" onclick="closeModal()">✕</button></div><div id="detail"></div></div></div>
<script>
let items=JSON.parse(localStorage.getItem('aircraftV2')||'[]'),editId=null,pending=[],view='posts';const $=id=>document.getElementById(id);
function save(){localStorage.setItem('aircraftV2',JSON.stringify(items))}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===id));if(id==='dashboard')renderFeed();if(id==='collection')renderCollection();if(id==='achievements')renderAchievements();scrollTo(0,0)}
function stats(){let n=items.reduce((a,x)=>a+x.photos.length,0);$('aircraftCount').textContent=items.length;$('photoCount').textContent=n;$('countTop').textContent=items.length+' Aircraft'}
function postHTML(x){let title=[x.manufacturer,x.model].filter(Boolean).join(' ')||'Unbenanntes Flugzeug';return `<article class="post" onclick="openDetail('${x.id}')"><div class="photos">${x.photos.length?x.photos.map(p=>`<img src="${p}" loading="lazy">`).join(''):'<div class="placeholder"></div>'}<span class="dots">${x.photos.length} 📷</span></div><div class="postbody"><b>${esc(title)}</b><div class="sub">${esc(x.airline||'')}</div><div class="tap">Tippen für Details →</div></div></article>`}
function renderFeed(){stats();let a=[...items].sort((x,y)=>y.created-x.created);$('feed').innerHTML=a.length?a.map(postHTML).join(''):'<div class="empty">Noch keine Flugzeuge.<br><br>Füge dein erstes Aircraft hinzu. ✈️</div>'}
function vals(k){return[...new Set(items.map(x=>x[k]).filter(Boolean))].sort()}function fill(id,k,l){$(id).innerHTML='<option value="">'+l+'</option>'+vals(k).map(v=>`<option>${esc(v)}</option>`).join('')}
function renderCollection(){[['mf','manufacturer','Hersteller'],['af','airline','Airline'],['vf','variant','Variante'],['rf','registration','Registrierung']].forEach(a=>fill(...a));let q=$('q').value.toLowerCase(),m=$('mf').value,a=$('af').value,v=$('vf').value,r=$('rf').value;let arr=items.filter(x=>{let h=[x.manufacturer,x.model,x.variant,x.airline,x.registration,x.airport].join(' ').toLowerCase();return(!q||h.includes(q))&&(!m||x.manufacturer===m)&&(!a||x.airline===a)&&(!v||x.variant===v)&&(!r||x.registration===r)}).sort((x,y)=>y.created-x.created);$('resultCount').textContent=arr.length+' Aircraft';$('collectionContent').innerHTML=view==='grid'?`<div class="grid">${arr.flatMap(x=>x.photos.map(p=>`<img src="${p}" onclick="openDetail('${x.id}')">`)).join('')}</div>`:(arr.length?arr.map(postHTML).join(''):'<div class="empty">Keine Treffer.</div>')}
function setView(v){view=v;renderCollection()}function resetFilters(){$('q').value='';['mf','af','vf','rf'].forEach(id=>$(id).value='');renderCollection()}
function previewFiles(e){let incoming=[];pending=[...e.target.files].map(f=>({file:f,url:URL.createObjectURL(f)}));renderPreview()}function renderPreview(){$('preview').innerHTML=pending.map((p,i)=>`<div class="thumb"><img src="${p.url}"><button type="button" onclick="pending.splice(${i},1);renderPreview()">×</button></div>`).join('')}
function dataURL(f){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
async function publish(e){e.preventDefault();let photos=[];for(let p of pending)photos.push(p.file?await dataURL(p.file):p.url);let data={id:editId||crypto.randomUUID(),created:editId?(items.find(x=>x.id===editId)?.created||Date.now()):Date.now(),photos};['manufacturer','model','variant','airline','registration','airport'].forEach(k=>data[k]=$(k).value.trim());if(editId)items[items.findIndex(x=>x.id===editId)]=data;else items.push(data);let wasEdit=!!editId;save();resetForm();showPage('dashboard');toast(wasEdit?'Flugzeug erfolgreich gespeichert!':'Flugzeug erfolgreich veröffentlicht!');renderMilestone();}
function resetForm(){editId=null;pending=[];$('formTitle').textContent='Neues Flugzeug';document.querySelector('form').reset();$('preview').innerHTML=''}
function openDetail(id){let x=items.find(y=>y.id===id);$('detailTitle').textContent=[x.manufacturer,x.model].filter(Boolean).join(' ')||'Flugzeug';$('detail').innerHTML=`<div class="detailphotos">${x.photos.map(p=>`<img src="${p}">`).join('')}</div><div class="detailbody"><h2>${esc([x.manufacturer,x.model,x.variant].filter(Boolean).join(' ')||'Unbenannt')}</h2><div class="chips">${[['Airline',x.airline],['Registrierung',x.registration],['Flughafen',x.airport],['Hersteller',x.manufacturer],['Modell',x.model],['Variante',x.variant]].filter(a=>a[1]).map(a=>`<span class="chip"><b>${a[0]}</b><br>${esc(a[1])}</span>`).join('')}</div><div class="actions"><button class="secondary" onclick="editItem('${x.id}')">✏️ Bearbeiten</button><button class="secondary danger" onclick="deleteItem('${x.id}')">🗑️ Löschen</button></div></div>`;$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show')}function deleteItem(id){if(!confirm('Möchtest du dieses Flugzeug wirklich aus deiner Sammlung löschen?'))return;items=items.filter(x=>x.id!==id);save();closeModal();renderFeed();renderCollection();renderAchievements()}
function editItem(id){let x=items.find(y=>y.id===id);closeModal();editId=id;$('formTitle').textContent='Flugzeug bearbeiten';['manufacturer','model','variant','airline','registration','airport'].forEach(k=>$(k).value=x[k]||'');pending=x.photos.map(url=>({url}));renderPreview();showPage('add')}
function renderAchievements(){let ac=[['First Aircraft','Fotografiere dein erstes Flugzeug',items.length,1],['Aircraft Collector','Sammle 10 Flugzeuge',items.length,10],['Spotter 50','Sammle 50 Flugzeuge',items.length,50],['Airline Hunter','10 verschiedene Airlines',new Set(items.map(x=>x.airline).filter(Boolean)).size,10],['Airbus Collector','10 verschiedene Airbus-Modelle',new Set(items.filter(x=>x.manufacturer.toLowerCase()==='airbus').map(x=>x.model).filter(Boolean)).size,10],['Boeing Hunter','10 verschiedene Boeing-Modelle',new Set(items.filter(x=>x.manufacturer.toLowerCase()==='boeing').map(x=>x.model).filter(Boolean)).size,10],['100 Aircraft','Sammle 100 Flugzeuge',items.length,100]];$('achList').innerHTML=ac.map(a=>{let done=a[2]>=a[3],pct=Math.min(100,a[2]/a[3]*100);return `<div class="ach ${done?'':'locked'}"><div style="display:flex;justify-content:space-between"><b>${done?'🏆':'🔒'} ${a[0]}</b><span>${Math.min(a[2],a[3])}/${a[3]}</span></div><div class="small">${a[1]}</div><div class="bar"><i style="width:${pct}%"></i></div></div>`}).join('')}

function toast(msg){let t=$('toast');t.textContent='✓ '+msg;t.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>t.classList.remove('show'),2600)}
const ranks=[['First Flight',1,0,0],['Spotter',10,3,0],['Enthusiast',25,8,5],['Aviation Hunter',50,15,10],['Aircraft Collector',100,30,20],['Master Spotter',250,60,35],['Aviation Legend',500,100,50]];
function uniq(k,fn=()=>true){return new Set(items.filter(fn).map(x=>x[k]).filter(Boolean)).size}
function currentRank(){let n=items.length,m=uniq('model'),a=uniq('airline'),r=ranks[0];for(let x of ranks)if(n>=x[1]&&m>=x[2]&&a>=x[3])r=x;return r}
function renderAchievements(){
 let n=items.length,m=uniq('model'),a=uniq('airline'),r=currentRank(),idx=ranks.indexOf(r),next=ranks[Math.min(idx+1,ranks.length-1)];
 let rb=`<div class="rankbox"><div class="small">CURRENT RANK</div><h2 style="margin:6px 0">${r[0]} ${idx===ranks.length-1?'👑':''}</h2><div class="small">${n} Aircraft · ${m} Modelle · ${a} Airlines</div>`;
 if(idx<ranks.length-1){let need=Math.max(0,next[1]-n);rb+=`<div class="bar"><i style="width:${Math.min(100,n/next[1]*100)}%"></i></div><div class="small" style="margin-top:7px">${need?need+' Aircraft bis '+next[0]:'Weitere Bedingungen fehlen noch'}</div>`} rb+='</div>';
 $('achievements').querySelector('.muted').textContent='Keine XP – echte Sammlung, echte Meilensteine.';
 $('achList').innerHTML=rb+[
 ['First Flight','Fotografiere dein erstes Aircraft','Common',n,1],
 ['Aircraft Collector','Sammle 10 Aircraft','Common',n,10],
 ['Airline Hunter','10 verschiedene Airlines','Uncommon',a,10],
 ['Airbus Collector','10 verschiedene Airbus-Modelle','Rare',uniq('model',x=>String(x.manufacturer).toLowerCase()==='airbus'),10],
 ['Boeing Hunter','10 verschiedene Boeing-Modelle','Rare',uniq('model',x=>String(x.manufacturer).toLowerCase()==='boeing'),10],
 ['Spotter 50','Sammle 50 Aircraft','Epic',n,50],
 ['Collector 100','Sammle 100 Aircraft','Legendary',n,100],
 ['Aviation Legend','Sammle 500 Aircraft','Mythic',n,500],
 ['Model Explorer','50 verschiedene Modelle','Mythic',m,50]
 ].map(a=>{let done=a[3]>=a[4],pct=Math.min(100,a[3]/a[4]*100);return `<div class="ach ${done?'':'locked'}"><div style="display:flex;justify-content:space-between"><b>${done?'🏆':'🔒'} ${a[0]}</b><span class="rarity">${a[2]}</span></div><div class="small">${a[1]}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="small" style="margin-top:6px">${Math.min(a[3],a[4])}/${a[4]}</div></div>`}).join('');
}
function renderYears(){
 let ys=[...new Set(items.map(x=>new Date(x.created).getFullYear()))].sort((a,b)=>b-a);
 if(!ys.length){$('yearList').innerHTML='<div class="empty">Noch keine Jahresdaten vorhanden.</div>';return}
 $('yearList').innerHTML=ys.map(y=>{let a=items.filter(x=>new Date(x.created).getFullYear()===y),photos=a.reduce((n,x)=>n+(x.photos?.length||0),0),air={};a.forEach(x=>{if(x.airline)air[x.airline]=(air[x.airline]||0)+1});let top=Object.entries(air).sort((x,y)=>y[1]-x[1])[0],mans={};a.forEach(x=>{if(x.manufacturer)mans[x.manufacturer]=(mans[x.manufacturer]||0)+1});let topm=Object.entries(mans).sort((x,y)=>y[1]-x[1])[0];return `<div class="yearcard"><h2 style="margin:0">${y}</h2><div class="yeargrid"><div><span class="small">Aircraft</span><b>${a.length}</b></div><div><span class="small">Fotos</span><b>${photos}</b></div><div><span class="small">Airlines</span><b>${new Set(a.map(x=>x.airline).filter(Boolean)).size}</b></div><div><span class="small">Modelle</span><b>${new Set(a.map(x=>x.model).filter(Boolean)).size}</b></div></div>${top?`<p class="small">Top Airline: <b>${esc(top[0])}</b> (${top[1]})</p>`:''}${topm?`<p class="small">Top Hersteller: <b>${esc(topm[0])}</b> (${topm[1]})</p>`:''}</div>`}).join('');
}
function renderMilestone(){
 let thresholds=[1,10,25,50,100,250,500],n=items.length,last=Number(localStorage.getItem('aircraftLastMilestoneV3')||0),hit=thresholds.filter(x=>n>=x).pop()||0;
 let box=document.getElementById('milestoneBox');if(!box)return;
 if(hit>last){localStorage.setItem('aircraftLastMilestoneV3',hit);box.innerHTML=`<div class="milestone"><div class="small">MILESTONE</div><h2 style="margin:5px 0">🎉 ${hit} AIRCRAFT</h2><div class="muted">Neuer Sammlung-Meilenstein erreicht!</div></div>`;setTimeout(()=>box.innerHTML='',3500)}else box.innerHTML='';
}

renderFeed();renderAchievements();renderYears();
</script><div id="toast" class="toast"></div></body></html>
